name: E2E

on:
  workflow_dispatch:

jobs:
  official-demo:
    name: Official E2E demo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SHADIFF_E2E_PROJECT: shadiff-e2e-${{ github.run_id }}
      SHADIFF_E2E_SUMMARY: ${{ runner.temp }}/shadiff-e2e-summary.json

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Validate E2E script syntax
        run: bash -n examples/e2e/run.sh

      - name: Run official E2E demo
        run: ./examples/e2e/run.sh --assert --summary --summary-file "${SHADIFF_E2E_SUMMARY}"

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shadiff-e2e-${{ github.run_id }}
          path: |
            examples/e2e/.work/
            ${{ runner.temp }}/shadiff-e2e-summary.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
